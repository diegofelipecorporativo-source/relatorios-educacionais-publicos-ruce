name: Publicar portal RUCE no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Ler arquivos do repositório
        uses: actions/checkout@v6
      - name: Conferir arquivos do portal
        run: |
          test -f index.html
          test -f 01_historico_habilidades.html
          test -f 02_comparativo_habilidades_por_escola.html
          test -f 03_painel_dispersao_estudantes.html
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar arquivos estaticos
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
